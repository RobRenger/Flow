# Fork-only build for RobRenger/Flow: a FOSS debug APK per push, no publishing.
name: Fork build

on:
  push:
    branches: [ chromecast ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: FOSS debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: >
          chmod +x gradlew &&
          ./gradlew :app:assembleFossDebug :app:testFossDebugUnitTest
          --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-foss-debug-arm64
          path: app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
          if-no-files-found: error
